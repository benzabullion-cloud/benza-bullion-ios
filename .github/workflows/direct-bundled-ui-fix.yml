name: Direct bundled UI fix

on:
  push:
    branches:
      - chatgpt/direct-bundled-ui-fix

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/direct-bundled-ui-fix
          fetch-depth: 0
      - name: Patch App/public/index.html
        run: python3 .github/scripts/direct_ui_patch.py
      - name: Verify markers
        run: |
          grep -F 'benza-direct-ui-2026-10-15' App/public/index.html
          grep -F 'Future lifetime price: $74.99 · Founder savings: $49.99' App/public/index.html
          grep -F 'Explore Benza Bullion' App/public/index.html
          grep -F 'Make this portfolio yours' App/public/index.html
      - name: Commit bundled UI source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add App/public/index.html
          git rm .github/scripts/direct_ui_patch.py .github/workflows/direct-bundled-ui-fix.yml
          git commit -m 'Apply guest and Founder changes to bundled HTML'
          git push origin HEAD:chatgpt/direct-bundled-ui-fix
