<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 96">
<defs>
  <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#F8FDFF"/>
    <stop offset=".55" stop-color="#C3D9E3"/>
    <stop offset="1" stop-color="#718C99"/>
  </linearGradient>
  <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".82"/>
    <stop offset=".22" stop-color="#F8FDFF"/>
    <stop offset=".75" stop-color="#C3D9E3"/>
    <stop offset="1" stop-color="#E3F4FB"/>
  </linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
    <feDropShadow dx="0" dy="3" stdDeviation="2.4" flood-color="#000000" flood-opacity=".30"/>
  </filter>
</defs>

<g filter="url(#shadow)" stroke="#718C99" stroke-width="1.15" stroke-linejoin="round">
  <!-- left stack: 3 cylindrical coins -->
  <g transform="translate(10 44)">
    <rect x="0" y="20" width="47" height="9" rx="4.5" fill="url(#face)"/>
    <ellipse cx="23.5" cy="20" rx="23.5" ry="6.4" fill="url(#top)" stroke="#E3F4FB"/>
    <path d="M5 25.5 C17 29 30 29 42 25.5" fill="none" stroke="#E3F4FB" stroke-opacity=".55"/>
  </g>
  <g transform="translate(10 33)">
    <rect x="0" y="20" width="47" height="9" rx="4.5" fill="url(#face)"/>
    <ellipse cx="23.5" cy="20" rx="23.5" ry="6.4" fill="url(#top)" stroke="#E3F4FB"/>
    <path d="M5 25.5 C17 29 30 29 42 25.5" fill="none" stroke="#E3F4FB" stroke-opacity=".55"/>
  </g>
  <g transform="translate(10 22)">
    <rect x="0" y="20" width="47" height="9" rx="4.5" fill="url(#face)"/>
    <ellipse cx="23.5" cy="20" rx="23.5" ry="6.4" fill="url(#top)" stroke="#E3F4FB"/>
    <ellipse cx="23.5" cy="20" rx="15.5" ry="3.5" fill="none" stroke="#ffffff" stroke-opacity=".24"/>
  </g>

  <!-- right stack: 2 cylindrical coins, offset to read as a stack -->
  <g transform="translate(60 48)">
    <rect x="0" y="17" width="49" height="9" rx="4.5" fill="url(#face)"/>
    <ellipse cx="24.5" cy="17" rx="24.5" ry="6.6" fill="url(#top)" stroke="#E3F4FB"/>
    <path d="M5 22.3 C17 26 32 26 44 22.3" fill="none" stroke="#E3F4FB" stroke-opacity=".55"/>
  </g>
  <g transform="translate(60 36)">
    <rect x="0" y="17" width="49" height="9" rx="4.5" fill="url(#face)"/>
    <ellipse cx="24.5" cy="17" rx="24.5" ry="6.6" fill="url(#top)" stroke="#E3F4FB"/>
    <ellipse cx="24.5" cy="17" rx="16" ry="3.6" fill="none" stroke="#ffffff" stroke-opacity=".23"/>
  </g>

  <!-- one angled coin leaning between stacks for a more premium emblem silhouette -->
  <g transform="translate(48 17) rotate(-12 18 22)">
    <rect x="0" y="16" width="38" height="8" rx="4" fill="url(#face)"/>
    <ellipse cx="19" cy="16" rx="19" ry="5.4" fill="url(#top)" stroke="#E3F4FB"/>
    <ellipse cx="19" cy="16" rx="11.5" ry="2.7" fill="none" stroke="#ffffff" stroke-opacity=".28"/>
  </g>
</g>
</svg>